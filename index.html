<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Spesa</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 24px auto; padding: 20px; }
    h1 { font-size: 30px; margin-bottom: 20px; }
    .utente { margin-bottom: 20px; font-size: 16px; }
    .utente button { margin-left: 8px; }
    .input-row { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; font-size: 22px; padding: 14px; box-sizing: border-box; }
    button { touch-action: manipulation; }
    .add-button { font-size: 20px; padding: 14px 18px; }
    .voice-button { width: 52px; flex: 0 0 52px; border: 1px solid #aaa; border-radius: 8px; background: #f5f5f5; font-size: 23px; }
    .voice-button.ascolto { border-color: #b42318; background: #fee4e2; }
    #messaggio { margin-top: 16px; min-height: 24px; font-size: 18px; }
    #lista { margin-top: 28px; }
    .riga-prodotto { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #ddd; }
    .nome-prodotto { flex: 1; font-size: 21px; overflow-wrap: anywhere; }
    .quantita { min-width: 28px; text-align: center; font-size: 20px; font-weight: bold; }
    .azione { width: 42px; height: 42px; border: none; border-radius: 8px; font-size: 22px; cursor: pointer; }
    .azione:disabled, .add-button:disabled, .voice-button:disabled, .azione-principale:disabled, .azione-secondaria:disabled { opacity: .45; cursor: default; }
    .vuota { font-size: 18px; color: #666; }
    .azione-principale { width: 100%; padding: 14px; font-size: 20px; }
    .azione-secondaria { width: 100%; padding: 12px; font-size: 16px; }
    #sceltaUtente { margin-bottom: 24px; padding: 18px; border: 1px solid #ddd; border-radius: 12px; }
    .scelta-titolo { font-size: 20px; margin-bottom: 14px; }
    .scelta-bottoni { display: flex; gap: 12px; }
    .scelta-bottoni button { flex: 1; padding: 16px; font-size: 20px; }
    .install-button { width: 100%; margin: -8px 0 20px; padding: 12px; border: 1px solid #087f3f; border-radius: 10px; background: #e9f7ef; color: #075f31; font-size: 17px; font-weight: bold; }
    .import-open { margin-top: 12px; }
    .import-panel { margin-top: 14px; padding: 16px; border: 1px solid #ccc; border-radius: 12px; background: #fafafa; }
    .import-panel label { display: block; margin-bottom: 8px; font-size: 18px; font-weight: bold; }
    .import-panel textarea { width: 100%; min-height: 150px; padding: 12px; box-sizing: border-box; resize: vertical; font: inherit; font-size: 18px; }
    .import-actions { display: flex; gap: 8px; margin-top: 10px; }
    .import-actions button { flex: 1; padding: 12px 8px; font-size: 17px; }
    #riepilogoImport { margin-top: 14px; font-weight: bold; }
    .anteprima-import { margin-top: 8px; }
    .riga-import { padding: 9px 0; border-bottom: 1px solid #ddd; }
    .riga-import strong, .riga-import small { display: block; }
    .riga-import small { margin-top: 3px; color: #555; }
    .import-confirm { margin-top: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>🛒 Spesa</h1>

  <button id="btnInstalla" class="install-button" type="button" hidden>⬇ Installa app</button>

  <div id="sceltaUtente" style="display:none;">
    <div class="scelta-titolo">Chi usa questa app?</div>
    <div class="scelta-bottoni">
      <button onclick="impostaUtente('Giulio')">Giulio</button>
      <button onclick="impostaUtente('Alice')">Alice</button>
    </div>
  </div>

  <div class="utente">
    Utente: <strong id="nomeUtente"></strong>
    <button onclick="cambiaUtente()">Cambia</button>
  </div>

  <div class="input-row">
    <input id="prodotto" type="text" placeholder="Es. 2 latte" autofocus>
    <button id="btnVoce" class="voice-button" type="button" aria-label="Inserimento vocale" title="Inserimento vocale" hidden>🎤</button>
    <button id="btnAggiungi" class="add-button" onclick="aggiungi()">Aggiungi</button>
  </div>

  <div id="messaggio" aria-live="polite"></div>

  <button id="btnApriImport" class="azione-secondaria import-open" type="button">📋 Importa note</button>
  <section id="pannelloImport" class="import-panel" aria-labelledby="titoloImport" hidden>
    <label id="titoloImport" for="testoImport">Incolla la lista, un prodotto per riga</label>
    <textarea id="testoImport" placeholder="2 banane morbide&#10;detersivo per piatti&#10;fagioli scatola tre"></textarea>
    <div class="import-actions">
      <button id="btnAnalizzaImport" type="button">Analizza</button>
      <button id="btnAnnullaImport" type="button">Annulla</button>
    </div>
    <div id="riepilogoImport" aria-live="polite"></div>
    <div id="anteprimaImport" class="anteprima-import"></div>
    <button id="btnConfermaImport" class="azione-principale import-confirm" type="button" hidden>Importa nella lista</button>
  </section>

  <div id="lista"></div>

  <div style="margin-top:32px;">
    <button id="btnChiudi" class="azione-principale" onclick="chiudiSpesa()">✅ Spesa fatta</button>
  </div>

  <div style="margin-top:12px;">
    <button id="btnPulisci" class="azione-secondaria" onclick="confermaPulisciStorico()">🧹 Pulisci storico</button>
  </div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwFtJfXrdXZEuqq_nNgkepgpAqwaBsStzMLntpTX9eXICt52dJtv78BiUPYVbMZT5Q6/exec';
let callbackCounter = 0;
let utenteCorrente = localStorage.getItem('utenteSpesa');
let listaCorrente = [];
let operazioneInCorso = false;
let reconcileToken = 0;
let installPrompt = null;
let riconoscimentoVocale = null;
let ascoltoVocale = false;
let risultatoVocaleRicevuto = false;
let erroreVocaleRicevuto = false;
let testoImportAnalizzato = '';
let elementiImportAnalizzati = [];

if (!utenteCorrente) document.getElementById('sceltaUtente').style.display = 'block';
aggiornaUtenteUI();
configuraRiconoscimentoVocale();

function impostaUtente(nome) {
  utenteCorrente = nome;
  localStorage.setItem('utenteSpesa', nome);
  document.getElementById('sceltaUtente').style.display = 'none';
  aggiornaUtenteUI();
}

function cambiaUtente() {
  localStorage.removeItem('utenteSpesa');
  utenteCorrente = null;
  document.getElementById('sceltaUtente').style.display = 'block';
  aggiornaUtenteUI();
}

function aggiornaUtenteUI() {
  document.getElementById('nomeUtente').textContent = utenteCorrente || 'Nessuno';
}

function appInStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches;
}

window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
  if (!appInStandalone()) document.getElementById('btnInstalla').hidden = false;
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  document.getElementById('btnInstalla').hidden = true;
  document.getElementById('messaggio').textContent = 'App installata.';
});

document.getElementById('btnInstalla').addEventListener('click', async () => {
  if (!installPrompt) return;
  const promptCorrente = installPrompt;
  installPrompt = null;
  document.getElementById('btnInstalla').hidden = true;

  try {
    await promptCorrente.prompt();
    const scelta = await promptCorrente.userChoice;
    document.getElementById('messaggio').textContent = scelta.outcome === 'accepted'
      ? 'Installazione avviata.'
      : 'Installazione annullata.';
  } catch (error) {
    document.getElementById('messaggio').textContent = 'Impossibile avviare l’installazione.';
  }
});

function configuraRiconoscimentoVocale() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;

  const bottone = document.getElementById('btnVoce');
  try {
    riconoscimentoVocale = new SpeechRecognition();
  } catch (_) {
    return;
  }

  riconoscimentoVocale.lang = 'it-IT';
  riconoscimentoVocale.continuous = false;
  riconoscimentoVocale.interimResults = false;
  riconoscimentoVocale.maxAlternatives = 1;
  bottone.hidden = false;

  riconoscimentoVocale.onresult = event => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (!event.results[i].isFinal || !event.results[i][0]) continue;
      const trascrizione = String(event.results[i][0].transcript || '').trim();
      if (!trascrizione) continue;
      risultatoVocaleRicevuto = true;
      const input = document.getElementById('prodotto');
      input.value = trascrizione;
      input.focus();
      document.getElementById('messaggio').textContent = 'Testo riconosciuto. Controlla e premi Aggiungi.';
      break;
    }
  };

  riconoscimentoVocale.onerror = event => {
    erroreVocaleRicevuto = true;
    const messaggi = {
      'not-allowed': 'Permesso microfono negato.',
      'service-not-allowed': 'Permesso microfono non disponibile.',
      'no-speech': 'Non ho sentito nulla. Riprova.',
      'audio-capture': 'Microfono non disponibile.'
    };
    document.getElementById('messaggio').textContent = messaggi[event.error] || 'Riconoscimento vocale non riuscito.';
  };

  riconoscimentoVocale.onend = () => {
    if (!risultatoVocaleRicevuto && !erroreVocaleRicevuto) {
      document.getElementById('messaggio').textContent = 'Non ho sentito nulla. Riprova.';
    }
    ascoltoVocale = false;
    aggiornaPulsanteVoce();
  };

  bottone.addEventListener('click', avviaRiconoscimentoVocale);
  aggiornaPulsanteVoce();
}

function aggiornaPulsanteVoce() {
  const bottone = document.getElementById('btnVoce');
  if (!riconoscimentoVocale) return;
  bottone.disabled = operazioneInCorso || ascoltoVocale;
  bottone.classList.toggle('ascolto', ascoltoVocale);
  bottone.textContent = ascoltoVocale ? '…' : '🎤';
  bottone.setAttribute('aria-label', ascoltoVocale ? 'Ascolto in corso' : 'Inserimento vocale');
}

function avviaRiconoscimentoVocale() {
  if (!riconoscimentoVocale || ascoltoVocale || operazioneInCorso) return;
  ascoltoVocale = true;
  risultatoVocaleRicevuto = false;
  erroreVocaleRicevuto = false;
  aggiornaPulsanteVoce();
  document.getElementById('messaggio').textContent = 'Ascolto...';

  try {
    riconoscimentoVocale.start();
  } catch (_) {
    erroreVocaleRicevuto = true;
    ascoltoVocale = false;
    aggiornaPulsanteVoce();
    document.getElementById('messaggio').textContent = 'Riconoscimento vocale non riuscito.';
  }
}

function setBusy(busy) {
  if (busy && !operazioneInCorso) reconcileToken++;
  operazioneInCorso = busy;
  document.getElementById('prodotto').disabled = busy;
  document.getElementById('btnAggiungi').disabled = busy;
  document.getElementById('btnChiudi').disabled = busy;
  document.getElementById('btnPulisci').disabled = busy;
  document.getElementById('btnApriImport').disabled = busy;
  document.getElementById('testoImport').disabled = busy;
  document.getElementById('btnAnalizzaImport').disabled = busy;
  document.getElementById('btnAnnullaImport').disabled = busy;
  document.getElementById('btnConfermaImport').disabled = busy;
  document.querySelectorAll('.azione').forEach(btn => btn.disabled = busy);
  aggiornaPulsanteVoce();
}

function conTimeout(promise, ms, messaggio) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(messaggio)), ms))
  ]);
}

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const callbackName = '__spesaJsonp' + Date.now() + '_' + (++callbackCounter);
    const script = document.createElement('script');
    let chiusa = false;
    const timeout = setTimeout(() => cleanup(new Error('Timeout nella lettura del backend.')), 5000);

    function cleanup(error, data) {
      if (chiusa) return;
      chiusa = true;
      clearTimeout(timeout);
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
      if (error) reject(error); else resolve(data);
    }

    window[callbackName] = data => cleanup(null, data);
    script.onerror = () => cleanup(new Error('Impossibile leggere il backend.'));

    const query = new URLSearchParams({ ...params, callback: callbackName, _: String(Date.now()) });
    script.src = API + '?' + query.toString();
    document.head.appendChild(script);
  });
}

async function leggiLista() {
  const dati = await jsonp({ action: 'lista' });
  if (!dati.ok) throw new Error(dati.messaggio || 'Errore');
  return dati.lista || [];
}

async function caricaLista() {
  try {
    for (let tentativo = 0; tentativo < 3; tentativo++) {
      try {
        listaCorrente = await leggiLista();
        break;
      } catch (error) {
        if (tentativo === 2) throw error;
        await attesa(700);
      }
    }
    mostraLista(listaCorrente);
    return listaCorrente;
  } catch (error) {
    mostraErrore(error);
    throw error;
  }
}

function mostraLista(lista) {
  const contenitore = document.getElementById('lista');
  contenitore.innerHTML = '';

  if (!lista || lista.length === 0) {
    contenitore.innerHTML = '<div class="vuota">Niente da comprare.</div>';
    return;
  }

  lista.forEach(item => {
    const riga = document.createElement('div');
    riga.className = 'riga-prodotto';

    const nome = document.createElement('div');
    nome.className = 'nome-prodotto';
    nome.textContent = item.prodotto;

    const meno = document.createElement('button');
    meno.className = 'azione';
    meno.textContent = '−';
    meno.disabled = operazioneInCorso;
    meno.onclick = () => cambiaQuantita(item, -1);

    const quantita = document.createElement('div');
    quantita.className = 'quantita';
    quantita.textContent = item.quantita;

    const piu = document.createElement('button');
    piu.className = 'azione';
    piu.textContent = '+';
    piu.disabled = operazioneInCorso;
    piu.onclick = () => cambiaQuantita(item, 1);

    const cestino = document.createElement('button');
    cestino.className = 'azione';
    cestino.textContent = '🗑';
    cestino.disabled = operazioneInCorso;
    cestino.onclick = () => rimuovi(item);

    riga.append(nome, meno, quantita, piu, cestino);
    contenitore.appendChild(riga);
  });
}

async function postSenzaCors(dati) {
  return conTimeout(fetch(API, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(dati)
  }), 5000, 'Timeout durante la scrittura.');
}

function trovaIndice(lista, prodotto) {
  const key = normalizzaClient(prodotto);
  return lista.findIndex(item => normalizzaClient(item.prodotto) === key);
}

function trovaInLista(lista, prodotto) {
  const idx = trovaIndice(lista, prodotto);
  return idx >= 0 ? lista[idx] : undefined;
}

function aggiornaQuantitaLocale(prodotto, delta) {
  const idx = trovaIndice(listaCorrente, prodotto);
  if (idx < 0) return;
  const corrente = Number(listaCorrente[idx].quantita) || 1;
  if (delta < 0 && corrente <= 1) listaCorrente.splice(idx, 1);
  else listaCorrente[idx] = { ...listaCorrente[idx], quantita: corrente + delta };
  mostraLista(listaCorrente);
}

function rimuoviLocale(prodotto) {
  const idx = trovaIndice(listaCorrente, prodotto);
  if (idx >= 0) listaCorrente.splice(idx, 1);
  mostraLista(listaCorrente);
}

function aggiungiLocale(prodotto, quantita) {
  listaCorrente.push({ prodotto, quantita });
  mostraLista(listaCorrente);
}

function applicaImportLocale(elementi) {
  raggruppaImportazioneClient(elementi).forEach(elemento => {
    const esistente = trovaInLista(listaCorrente, elemento.prodotto);
    if (esistente) {
      esistente.quantita = Math.max(Number(esistente.quantita) || 1, elemento.quantita);
    } else {
      listaCorrente.push({ prodotto: elemento.prodotto, quantita: elemento.quantita });
    }
  });
  mostraLista(listaCorrente);
}

async function riconciliaInBackground() {
  const mioToken = ++reconcileToken;
  for (let i = 0; i < 5; i++) {
    try {
      const lista = await leggiLista();
      if (mioToken !== reconcileToken) return;
      listaCorrente = lista;
      mostraLista(listaCorrente);
      return;
    } catch (_) {
      await attesa(700);
    }
  }
  if (mioToken === reconcileToken) {
    document.getElementById('messaggio').textContent = 'Dati salvati, ma non riesco a verificare subito il foglio. Riproverò al prossimo aggiornamento.';
  }
}

async function cambiaQuantita(item, delta) {
  if (operazioneInCorso) return;
  const action = delta > 0 ? 'aumenta' : 'diminuisci';

  setBusy(true);
  document.getElementById('messaggio').textContent = '';
  aggiornaQuantitaLocale(item.prodotto, delta);

  try {
    await postSenzaCors({ action, prodotto: item.prodotto });
  } catch (error) {
    mostraErrore(error);
  } finally {
    setBusy(false);
    mostraLista(listaCorrente);
    riconciliaInBackground();
  }
}

async function rimuovi(item) {
  if (operazioneInCorso) return;

  setBusy(true);
  document.getElementById('messaggio').textContent = '';
  rimuoviLocale(item.prodotto);

  try {
    await postSenzaCors({ action: 'rimuovi', prodotto: item.prodotto });
  } catch (error) {
    mostraErrore(error);
  } finally {
    setBusy(false);
    mostraLista(listaCorrente);
    riconciliaInBackground();
  }
}

async function aggiungi() {
  if (operazioneInCorso) return;

  const input = document.getElementById('prodotto');
  const messaggio = document.getElementById('messaggio');
  const testo = input.value.trim();

  if (!testo) return;
  if (!utenteCorrente) {
    messaggio.textContent = 'Seleziona prima Giulio oppure Alice.';
    return;
  }

  const parsed = parseInputClient(testo);
  const giaPresente = trovaInLista(listaCorrente, parsed.prodotto);
  if (giaPresente) {
    messaggio.textContent = `${giaPresente.prodotto} è già presente in quantità ${giaPresente.quantita}.`;
    return;
  }

  setBusy(true);
  aggiungiLocale(parsed.prodotto, parsed.quantita);
  input.value = '';
  messaggio.textContent = `${parsed.prodotto} aggiunto.`;

  try {
    await postSenzaCors({ action: 'aggiungi', testo, utente: utenteCorrente });
  } catch (error) {
    mostraErrore(error);
  } finally {
    setBusy(false);
    mostraLista(listaCorrente);
    if (!input.disabled) input.focus();
    riconciliaInBackground();
  }
}

function apriImportazione() {
  if (operazioneInCorso) return;
  document.getElementById('pannelloImport').hidden = false;
  document.getElementById('testoImport').focus();
}

function annullaImportazione() {
  if (operazioneInCorso) return;
  document.getElementById('testoImport').value = '';
  invalidaAnalisiImportazione();
  document.getElementById('pannelloImport').hidden = true;
}

function invalidaAnalisiImportazione() {
  testoImportAnalizzato = '';
  elementiImportAnalizzati = [];
  document.getElementById('riepilogoImport').textContent = '';
  document.getElementById('anteprimaImport').replaceChildren();
  document.getElementById('btnConfermaImport').hidden = true;
}

function analizzaImportazione() {
  if (operazioneInCorso) return;
  const testo = document.getElementById('testoImport').value;
  const elementi = parseTestoImportazioneClient(testo);
  if (elementi.length === 0) {
    invalidaAnalisiImportazione();
    document.getElementById('riepilogoImport').textContent = 'Incolla almeno un prodotto.';
    return;
  }

  const gruppi = raggruppaImportazioneClient(elementi);
  const gruppiPerChiave = new Map(gruppi.map(elemento => [elemento.chiave, elemento]));
  const esistentiPerChiave = new Map(
    listaCorrente.map(elemento => [normalizzaClient(elemento.prodotto), elemento])
  );
  const giaViste = new Set();
  const anteprima = document.getElementById('anteprimaImport');
  anteprima.replaceChildren();

  elementi.forEach(elemento => {
    const chiave = normalizzaClient(elemento.prodotto);
    const gruppo = gruppiPerChiave.get(chiave);
    const esistente = esistentiPerChiave.get(chiave);
    let stato;

    if (giaViste.has(chiave)) {
      stato = `Duplicato nella nota: verrà usata la quantità ${gruppo.quantita}.`;
    } else if (esistente && gruppo.quantita > (Number(esistente.quantita) || 1)) {
      stato = `Già presente: quantità da ${esistente.quantita} a ${gruppo.quantita}.`;
    } else if (esistente) {
      stato = `Già presente: resta quantità ${esistente.quantita}.`;
    } else {
      stato = `Nuovo prodotto: quantità ${gruppo.quantita}.`;
    }
    giaViste.add(chiave);

    const riga = document.createElement('div');
    riga.className = 'riga-import';
    const prodotto = document.createElement('strong');
    prodotto.textContent = `${elemento.quantita} × ${elemento.prodotto}`;
    const dettaglio = document.createElement('small');
    dettaglio.textContent = stato;
    riga.append(prodotto, dettaglio);
    anteprima.appendChild(riga);
  });

  const giaPresenti = gruppi.filter(elemento => esistentiPerChiave.has(elemento.chiave)).length;
  const nuovi = gruppi.length - giaPresenti;
  const duplicati = elementi.length - gruppi.length;
  document.getElementById('riepilogoImport').textContent =
    `${nuovi} nuovi, ${giaPresenti} già presenti, ${duplicati} duplicati nella nota.`;
  document.getElementById('btnConfermaImport').hidden = false;
  testoImportAnalizzato = testo;
  elementiImportAnalizzati = elementi;
}

async function confermaImportazione() {
  if (operazioneInCorso || elementiImportAnalizzati.length === 0) return;
  const testoAttuale = document.getElementById('testoImport').value;
  if (testoAttuale !== testoImportAnalizzato) {
    invalidaAnalisiImportazione();
    document.getElementById('riepilogoImport').textContent = 'La lista è cambiata: analizzala di nuovo.';
    return;
  }
  if (!utenteCorrente) {
    document.getElementById('messaggio').textContent = 'Seleziona prima Giulio oppure Alice.';
    return;
  }

  const testoDaInviare = testoImportAnalizzato;
  const elementiDaImportare = elementiImportAnalizzati.slice();
  const gruppi = raggruppaImportazioneClient(elementiDaImportare);
  const esistenti = new Set(listaCorrente.map(item => normalizzaClient(item.prodotto)));
  const nuovi = gruppi.filter(item => !esistenti.has(item.chiave)).length;
  const giaPresenti = gruppi.length - nuovi;

  setBusy(true);
  applicaImportLocale(elementiDaImportare);
  document.getElementById('messaggio').textContent =
    `${nuovi} aggiunti, ${giaPresenti} già presenti.`;

  try {
    await postSenzaCors({ action: 'importa', testo: testoDaInviare, utente: utenteCorrente });
    document.getElementById('testoImport').value = '';
    invalidaAnalisiImportazione();
    document.getElementById('pannelloImport').hidden = true;
  } catch (error) {
    mostraErrore(error);
  } finally {
    setBusy(false);
    mostraLista(listaCorrente);
    riconciliaInBackground();
  }
}

async function chiudiSpesa() {
  if (operazioneInCorso) return;
  if (!listaCorrente.length) {
    document.getElementById('messaggio').textContent = 'La lista è già vuota.';
    return;
  }
  if (!confirm('Confermi che la spesa è fatta? La lista verrà salvata nello storico e poi svuotata.')) return;

  setBusy(true);
  const backup = listaCorrente.slice();
  listaCorrente = [];
  mostraLista(listaCorrente);
  document.getElementById('messaggio').textContent = 'Spesa salvata nello storico.';

  try {
    await postSenzaCors({ action: 'chiudi' });
  } catch (error) {
    listaCorrente = backup;
    mostraErrore(error);
  } finally {
    setBusy(false);
    mostraLista(listaCorrente);
    riconciliaInBackground();
  }
}

async function confermaPulisciStorico() {
  if (operazioneInCorso) return;
  if (!confirm('Vuoi davvero cancellare tutto lo storico?')) return;

  setBusy(true);
  document.getElementById('messaggio').textContent = 'Pulisco lo storico...';
  try {
    await postSenzaCors({ action: 'pulisciStorico' });
    document.getElementById('messaggio').textContent = 'Storico pulito.';
  } catch (error) {
    mostraErrore(error);
  } finally {
    setBusy(false);
    mostraLista(listaCorrente);
  }
}

function parseInputClient(input) {
  const testo = input.trim();
  const match = testo.match(/^(\d+)\s+(.+)$/);
  let quantita = 1;
  let prodotto = testo;
  if (match) {
    quantita = parseInt(match[1], 10);
    prodotto = match[2];
  }
  prodotto = prodotto.trim().replace(/\s+/g, ' ');
  prodotto = prodotto.charAt(0).toUpperCase() + prodotto.slice(1);
  return { prodotto, quantita };
}

function parseTestoImportazioneClient(testo) {
  return String(testo || '')
    .split(/\r?\n/)
    .map(parseRigaImportazioneClient)
    .filter(elemento => elemento !== null);
}

function parseRigaImportazioneClient(riga) {
  const testo = String(riga || '').trim().replace(/\s+/g, ' ');
  if (!testo) return null;

  const parti = testo.split(' ');
  let quantita = parseQuantitaItalianaClient(parti[0]);
  let indiceQuantita = quantita !== null && parti.length > 1 ? 0 : -1;
  if (indiceQuantita < 0) {
    quantita = parseQuantitaItalianaClient(parti[parti.length - 1]);
    indiceQuantita = quantita !== null && parti.length > 1 ? parti.length - 1 : -1;
  }
  if (indiceQuantita < 0) quantita = 1;
  else parti.splice(indiceQuantita, 1);

  let prodotto = parti.join(' ').trim().replace(/\s+/g, ' ');
  prodotto = prodotto.charAt(0).toUpperCase() + prodotto.slice(1);
  return { prodotto, quantita };
}

function parseQuantitaItalianaClient(valore) {
  const token = normalizzaClient(valore).replace(/[-'’]/g, '');
  if (/^\d+$/.test(token)) {
    const numero = parseInt(token, 10);
    return numero > 0 ? numero : null;
  }
  const unita = {
    un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5,
    sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10, undici: 11,
    dodici: 12, tredici: 13, quattordici: 14, quindici: 15,
    sedici: 16, diciassette: 17, diciotto: 18, diciannove: 19
  };
  if (Object.prototype.hasOwnProperty.call(unita, token)) return unita[token];
  const decine = {
    venti: 20, trenta: 30, quaranta: 40, cinquanta: 50,
    sessanta: 60, settanta: 70, ottanta: 80, novanta: 90
  };
  if (Object.prototype.hasOwnProperty.call(decine, token)) return decine[token];
  const cifre = { uno: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9 };
  for (const [nomeDecina, valoreDecina] of Object.entries(decine)) {
    for (const [nomeCifra, valoreCifra] of Object.entries(cifre)) {
      const radice = nomeCifra === 'uno' || nomeCifra === 'otto'
        ? nomeDecina.slice(0, -1)
        : nomeDecina;
      if (token === radice + nomeCifra) return valoreDecina + valoreCifra;
    }
  }
  return null;
}

function raggruppaImportazioneClient(elementi) {
  const perChiave = new Map();
  elementi.forEach(elemento => {
    const chiave = normalizzaClient(elemento.prodotto);
    const esistente = perChiave.get(chiave);
    if (!esistente) {
      perChiave.set(chiave, { chiave, prodotto: elemento.prodotto, quantita: elemento.quantita });
    } else {
      esistente.quantita = Math.max(esistente.quantita, elemento.quantita);
    }
  });
  return Array.from(perChiave.values());
}

function normalizzaClient(testo) {
  return String(testo || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function attesa(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function mostraErrore(error) {
  document.getElementById('messaggio').textContent = 'Errore: ' + error.message;
}

document.getElementById('prodotto').addEventListener('keydown', event => {
  if (event.key === 'Enter') aggiungi();
});
document.getElementById('btnApriImport').addEventListener('click', apriImportazione);
document.getElementById('btnAnalizzaImport').addEventListener('click', analizzaImportazione);
document.getElementById('btnAnnullaImport').addEventListener('click', annullaImportazione);
document.getElementById('btnConfermaImport').addEventListener('click', confermaImportazione);
document.getElementById('testoImport').addEventListener('input', invalidaAnalisiImportazione);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

caricaLista().catch(() => {});
